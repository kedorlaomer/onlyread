<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OnlyRead</title>
    <link rel="icon" type="image/png" href="images/only_read.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body {
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .feed-list {
            text-align: left;
            margin-top: 2rem;
        }
        .feed-item {
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .feed-form {
            margin-top: 2rem;
            margin-bottom: 2rem;
            padding: 1.25rem;
            border: 1px solid #eee;
            border-radius: 6px;
        }
        .feed-form h3 {
            margin-top: 0;
            margin-bottom: 1rem;
        }
        .feed-form .pure-form input,
        .feed-form .pure-form textarea,
        .feed-form .pure-form select {
            display: block;
            width: 100%;
            max-width: 32rem;
            margin-bottom: 0.75rem;
            box-sizing: border-box;
        }
        .feed-form .pure-form input.hidden {
            display: none;
        }
        .feed-form .pure-form textarea {
            min-height: 4rem;
        }
        .feed-form .pure-form button {
            margin-top: 0.25rem;
        }
        .readlater-list-row {
            max-width: 32rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .readlater-list-row .rl-list-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .readlater-list-row .rl-list-actions {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }
        .readlater-list-row .rl-share {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }
        .readlater-list-row .rl-share .rl-share-url {
            display: block;
            width: auto;
            flex: 1 1 14rem;
            min-width: 10rem;
            margin-bottom: 0;
            font-size: 0.85em;
        }
        .error {
            color: red;
            margin-top: 0.5rem;
        }
        .success {
            color: green;
            margin-top: 0.5rem;
        }
        .item-list {
            text-align: left;
        }
        .item {
            padding: 1rem 0;
            border-bottom: 1px solid #eee;
        }
        .item-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .item-title a {
            text-decoration: none;
            color: #333;
        }
        .item-title a:hover {
            text-decoration: underline;
        }
        .item.read {
            background-color: #f5f5f5;
        }
        .item-meta {
            font-size: 0.8em;
            color: #888;
            font-style: italic;
            margin-bottom: 0.25rem;
        }
        .item-feed {
            color: #666;
            font-size: 0.9em;
            margin-left: 0.5rem;
        }
        .item-feed a {
            color: #0078e4;
            text-decoration: none;
        }
        .item-feed a:hover {
            text-decoration: underline;
        }
        .item-feed a.filter-feed-link {
            cursor: pointer;
        }
        .item-feed a.mark-all-read-link {
            color: #888;
        }
        .item-feed a.mark-all-read-link:hover {
            color: #0078e4;
        }
        .item-feed a.mark-unread-link {
            color: #888;
        }
        .item-feed a.mark-unread-link:hover {
            color: #0078e4;
        }
        .item-feed span.item-action {
            color: #888;
        }
        .item-content {
            color: #444;
            margin-top: 0.5rem;
            line-height: 1.5;
        }
        .item-content a.item-link {
            color: #888;
            text-decoration: underline;
        }
        .item-content a.item-link:hover {
            color: #0078e4;
        }
        .item-content a.expand-link {
            display: inline-block;
            margin-left: 0.35rem;
            padding: 0.05rem 0.5rem;
            border: 1px solid #b8d9f5;
            border-radius: 999px;
            background: #eaf3fd;
            color: #0078e4;
            font-size: 0.85em;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, border-color 0.15s;
        }
        .item-content a.expand-link:hover {
            background: #d7e9fb;
            border-color: #0078e4;
            text-decoration: none;
        }
        .item-content a.expand-link .expand-ellipsis {
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .nav-link {
            cursor: pointer;
            color: #0078e4;
        }
        .nav-link.active {
            font-weight: bold;
            text-decoration: underline;
        }
        .page {
            display: block;
        }
        .sync-status {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100vw - 2rem);
            font-size: 0.8em;
            color: #555;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0.35rem 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 1;
            transition: opacity 0.5s;
        }
        .sync-status:empty {
            display: none;
        }
        .sync-status.fade {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/only_read.png" alt="OnlyRead Logo" style="max-width: 150px; margin-bottom: 1rem;">
        
        <div id="login-page">
            <p>Please log in to continue.</p>
            <button id="login-btn" class="pure-button pure-button-primary">Log In</button>
        </div>

        <div id="user-page" class="hidden">
            <div class="nav-bar">
                <span id="nav-read" class="nav-link">Read</span>
                <span id="nav-manage" class="nav-link">Manage</span>
                <span id="nav-readlater" class="nav-link">Read Later</span>
                <span id="nav-logout" class="nav-link">Logout</span>
            </div>
            
            <div id="page-read" class="page hidden">
                <div style="margin-bottom: 1rem;">
                    <button id="toggle-read-btn" class="pure-button pure-button-small">Hide Read</button>
                    <button id="sync-btn" class="pure-button pure-button-small">Sync</button>
                </div>
                <div id="items-container"></div>
            </div>
            
            <div id="page-readlater" class="page hidden">
                <div class="feed-form">
                    <h3>Save a link to read later</h3>
                    <form id="readlater-form" class="pure-form">
                        <select id="rl-list"></select>
                        <input type="text" id="rl-newlist" class="hidden" placeholder="New list name">
                        <input type="url" id="rl-link" placeholder="https://example.com/article" required>
                        <input type="text" id="rl-title" placeholder="Title (optional)">
                        <textarea id="rl-desc" placeholder="Description (optional)"></textarea>
                        <button type="submit" class="pure-button pure-button-primary">Save</button>
                    </form>
                    <div id="readlater-message"></div>
                </div>
                <div class="feed-form">
                    <h3>Your lists</h3>
                    <div id="readlater-lists"></div>
                </div>
            </div>

            <div id="page-manage" class="page">
                <h1>Welcome, <span id="user-name"></span>!</h1>
                
                <div class="feed-form">
                    <h3>Subscribe to RSS Feed</h3>
                    <form id="subscribe-form" class="pure-form">
                        <input type="url" id="feed-url" placeholder="https://example.com/feed.xml" required>
                        <button type="submit" class="pure-button pure-button-primary">Subscribe</button>
                    </form>
                    <div id="feed-message"></div>
                </div>

                <div class="feed-form">
                    <h3>Import Feeds</h3>
                    <form id="import-form" class="pure-form">
                        <input type="file" id="import-file" accept=".txt,.opml,.xml">
                        <button type="submit" class="pure-button">Import</button>
                    </form>
                    <div id="import-message"></div>
                </div>

                <div class="feed-list">
                    <h3>Your Feeds</h3>
                    <div style="margin-bottom: 1rem;">
                        <button id="export-opml-btn" class="pure-button pure-button-small">Export OPML</button>
                        <button id="export-text-btn" class="pure-button pure-button-small">Export Text</button>
                    </div>
                    <div id="feeds-container"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="sync-status" class="sync-status"></div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
